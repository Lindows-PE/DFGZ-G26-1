<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <title>高一（1）班小组量化考核系统</title>
        <link rel="shortcut icon" href="icon.ico" type="image/x-icon" />
        <link rel="stylesheet" href="./style/style.css">
        <script src="javascript/content.js"></script>
        <script src="javascript/script.js"></script>
        <script>
            let loadNum = 0;
            let totalType = 0;
            let table = [];

            function getDateByMode() {
                switch (totalType) {
                    case 0:    // 每日
                        return Math.floor(new Date()/86400000);
                    case 1:    // 每周
                        return Math.floor((new Date()/86400000 + 3) / 7) * 7 - 3;
                    case 2:    // 十五天内
                        return Math.floor(new Date()/86400000) - 15;
                    case 3:    // 本月
                        return Math.floor(new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime() / 86400000);
                    default:
                        return 0;
                }
            }

            function getDateStrByMode() {
                switch (totalType) {
                    case 0:
                        return '今日';
                    case 1:
                        return '本周';
                    case 2:
                        return '十五天内';
                    case 3:
                        return '本月';
                    default:
                        return '';
                }
            }

            function getDateStr(date) {
                const dateObj = new Date(date * 86400000);
                return dateObj.getFullYear() + '-' + String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
            }

            async function initData() {
                try {
                    const response = await fetch('https://dfgz2601.lindows.indevs.in/get');
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    table = await response.json();
                    loadNew(30);
                } catch (err) {
                    alert(err);
                }
            }

            function readTableByNum(num) {
                let result = [];

                // 遍历
                for (let i = 0; i < num; i++) {
                    if (table.length <= i) {
                        break;
                    }
                    result.push(table[table.length - i - 1]);
                }
                
                return result;
            }

            function readTableByDate(date) {
                if (table.length == 0) {
                    return [];
                }
                
                let result = [];

                // 遍历
                for (let i = 0; i < table.length; i++) {
                    let one = table[table.length - i - 1];
                    if (one.date < date) {
                        break;
                    }
                    result.push(one);
                }
                
                return result;
            }

            async function writeToTable(name, point, reason) {
                try {
                    const response = await fetch('https://dfgz2601.lindows.indevs.in/score?name=' + name + '&point=' + point + '&reason=' + reason);
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    if (response.status != 200) {
                        throw new Error(response.message);
                    }
                } catch (err) {
                    alert(err.name + err.message);
                }
            }

            function loadNew(num) {
                loadNum = 0;
                document.getElementById('tableView').querySelector('tbody').innerHTML = '';
                loadMore(num);
            }

            function loadMore(num) {
                let lastMore = document.getElementById('more');
                if (lastMore) {
                    lastMore.remove();
                }

                let loaded = loadNum;
                loadNum = loadNum + num;
                let loadFinished = false;
                let table = readTableByNum(loadNum);

                if (table.length < loadNum) {
                    loadNum = table.length;
                    loadFinished = true;
                }

                let tableView = document.getElementById('tableView');

                for (let i = loaded; i < loadNum; i++) {
                    let one = table[i];

                    if (!getGroupByName(one.name).trim()) {
                        continue;
                    }

                    let tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + getDateStr(one.date) + '</td><td>' + one.name + '</td><td>' + getGroupByName(one.name) + '</td><td>' + (one.point > 0 ? '+' : '') + one.point + '</td><td>' + one.reason;
                    tableView.querySelector('tbody').appendChild(tr);
                }

                if (!loadFinished) {
                    let more = document.createElement('p');
                    more.id = 'more';
                    more.onclick = function() {
                        loadMore(30);
                    };
                    more.innerHTML = '加载更多';
                    more.style.display = 'flex';
                    more.style.justifyContent = 'center';
                    document.body.appendChild(more);
                }
            }

            function showAddWindow() {
                let nameOptions = '<datalist id="names">';
                for (let key in group) {
                    let one = group[key];
                    for (let i = 0; i < one.length; i ++) {
                        nameOptions = nameOptions + '<option value="' + one[i] + '">';
                    }
                }
                nameOptions = nameOptions + '</datalist>';
                dialog('<div style="padding: 1px;"><h4 style="padding: 0px;">请记录</h4></div><form onsubmit="record(event); return false;" id="newRecord" style="white-space: nowrap;"><div style="padding: 4px;"><label>名字</label><input type="text" name="name" list="names">' + nameOptions + '</div><div style="padding: 4px;"><label>分数（扣分用负数）</label><input type="number" name="point"></div><div style="padding: 4px;"><label>原因</label><input type="text" name="reason" list="options"><datalist id="options"><option value="上课/限时说小话"><option value="迟到"><option value="早读优秀"><option value="寝室问题"><option value="上课写无关作业"><option value="卫生打扫不合格"><option value="辱骂班干部"><option value="无故旷课"><option value="早退"><option value="携带违禁物品"><option value="上课睡觉"></datalist></div><div style="padding: 4px;"><button type="button" onclick="closeDialog()" style="margin-right: auto;">取消</button><button type="submit" style="margin-right: auto;">提交</button></form>');
              }

            function changeMode(sel) {
                totalType = parseInt(sel.value) - 1;
                closeWindow();
                showTotalWindow();
            }

            function showTotalWindow() {
                let div = dialog('<div class="title"><h4>高一（1）班小组分数汇总（' + getDateStrByMode() + '）</h4><div class="title-end"><select onchange="changeMode(this);"><option value="1">今日</option><option value="2">本周</option><option value="3">十五天内</option><option value="4">本月</option></select><div class="button" onclick="closeDialog()"><p>取消</p></div></div></div><table style="margin: 8px; width: 100%;"><thead><tr><th>组名</th><th>分数</th><th>原因</th></tr></thead><tbody></tbody></table>');
                div.querySelector('select').value = '' + (totalType + 1);
                let tablebody = div.querySelector('tbody');

                let table = readTableByDate(getDateByMode());
                let result = {};

                for (let key in group) {
                    result[key] = {point: 0, reason: ""};
                }

                for (let i = 0; i < table.length; i++) {
                    let one = table[i];
                    let group = getGroupByName(one.name);
                    if (!(group in result)) {
                        result[group] = {point: 0, reason: ""};
                    }
                    let oneObj = result[group];
                    result[group] = {point: parseInt(oneObj.point) + parseInt(one.point), reason: oneObj.reason + one.name + '因' + one.reason + (parseInt(one.point) > 0 ? '得' + one.point : '扣' + ( - one.point)) + '分；'};
                }

                for (let key in group) {
                    let tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + key +  '</td><td>' + result[key].point + '</td><td>' + result[key].reason + '</td>';
                    tablebody.appendChild(tr);
                }
            }

            function record(e) {
                e.preventDefault();

                let form = document.getElementById('newRecord');
                let name = form.name.value;
                let point = form.point.value;
                let reason = form.reason.value;

                if (!name.trim() || !point || isNaN(point) || parseInt(point) === 0 || !reason.trim()) {
                    alert('请完整填写！');
                    return;
                }
                
                if (!getGroupByName(name).trim()) {
                    alert('名称不正确，请重新填写');
                    return;
                }

                table.push({name: name, point: point, reason: reason, date: getDate()});
                loadNew(30);
                closeDialog();
                writeToTable(name, point, reason);
            }
        </script>
    </head>
    <body>
        <div class="title">
            <a href="index.html"><img src="https://p.qlogo.cn/gh/1097133778/1097133778/100/" style="width: 48px; height: 48px; border-radius: 24px; padding: 8px; "></a>
            <h1 style="font-weight: 900;">高一（1）班小组量化考核系统</h1>
            <div class="title-end">
                <div class="button" onclick="showAddWindow()">
                    <p>添加记录</p>
                </div>
                <div class="button" onclick="showTotalWindow()">
                    <p>查看汇总</p>
                </div>
                <!--<div class="button" onclick="showControlWindow()">
                    <p>管理面板</p>
                </div>-->
            </div>
        </div>
        <table id="tableView" style="margin: 8px; width: 100%;">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>名称</th>
                    <th>组名</th>
                    <th>分数</th>
                    <th>原因</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <script>
            initData();
        </script>
    </body>
</html>
