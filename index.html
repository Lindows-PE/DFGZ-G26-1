    <script>
      // 加载冷笑话
      let chill = document.getElementById('chill');
      chill.innerHTML = '<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="24" height="24"><path d="M394.5472 864.2048c0 21.5552 17.6128 39.168 39.168 39.168h156.5184c21.504 0 39.168-17.6128 39.168-39.168v-39.1168H394.5472v39.1168M512 120.6272a273.9712 273.9712 0 0 0-273.9712 273.9712c0 93.1328 46.592 175.1552 117.3504 224.6656v88.4224c0 21.5552 17.664 39.168 39.168 39.168h234.8544c21.504 0 39.1168-17.6128 39.1168-39.168v-88.4224a273.5616 273.5616 0 0 0 117.4528-224.6656A273.9712 273.9712 0 0 0 512 120.6272m111.7696 434.432l-33.536 23.296v90.2144H433.7152V578.56l-33.536-23.296a196.1984 196.1984 0 0 1-83.8656-160.4608A196.096 196.096 0 0 1 512 199.0656a195.9936 195.9936 0 0 1 195.6864 195.7376 195.7888 195.7888 0 0 1-83.9168 160.256" fill="#000000"></path></svg><p style="white-space: nowrap; margin-left: 8px;">' + getTips() + '</p><div></div>';

      // 加载动画
      const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // 容器进入屏幕
                    const group = entry.target;
                    Array.from(group.children).forEach((child, index) => {
                        setTimeout(() => {
                            child.classList.add('show');
                        }, index * 150);  // 每个延迟 150ms
                    });

                    // 只触发一次
                    observer.unobserve(group);
                }
            });
        }, {
            threshold: 0.5,  // 容器 50% 可见时触发
            rootMargin: '0px 0px -50px 0px'
        });

        // ===== 观察所有动画容器 =====
        document.querySelectorAll('.scroll_animated').forEach(group => {
            observer.observe(group);
        });
    </script>
